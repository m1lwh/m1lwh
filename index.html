    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funsmine | Java Developer & Minecraft Enthusiast</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #0f0f1a;
            --bg-card: #12121f;
            --bg-card-hover: #181830;
            --text-primary: #e0e0f0;
            --text-secondary: #a0a0c0;
            --text-muted: #6a6a8a;
            --accent-cyan: #00e5ff;
            --accent-cyan-dim: #00b8d4;
            --accent-purple: #b44dff;
            --accent-purple-dim: #8c2eff;
            --accent-green: #4cff4c;
            --accent-green-dim: #2ecc2e;
            --accent-pink: #ff4da6;
            --accent-orange: #ff8c42;
            --accent-yellow: #ffd740;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(0, 229, 255, 0.3);
            --border-purple-glow: rgba(180, 77, 255, 0.3);
            --glass-bg: rgba(18, 18, 31, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-glow: 0 0 30px rgba(0, 229, 255, 0.15);
            --shadow-purple-glow: 0 0 30px rgba(180, 77, 255, 0.15);
            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.5);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan-dim) var(--bg-primary);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-cyan-dim);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            cursor: default;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─── Canvas Background ─────────────────────── */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }

        /* ─── Custom Cursor Trail ─────────────────── */
        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-cyan), 0 0 40px var(--accent-cyan), 0 0 60px rgba(0, 229, 255, 0.4);
            transition: transform 0.1s ease-out, opacity 0.3s;
            opacity: 0;
            mix-blend-mode: screen;
        }
        .cursor-trail.active {
            opacity: 1;
        }
        .cursor-dot {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.3s;
            opacity: 0;
        }
        .cursor-dot.active {
            opacity: 1;
        }
        .cursor-dot.hovering {
            width: 40px;
            height: 40px;
            border-color: var(--accent-purple);
            border-width: 2px;
        }

        /* ─── Main Container ──────────────────────── */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ─── Navigation ──────────────────────────── */
        .navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.6), var(--shadow-glow);
            transition: var(--transition-smooth);
            flex-wrap: wrap;
            justify-content: center;
        }
        .navbar:hover {
            box-shadow: 0 10px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(0, 229, 255, 0.25);
            border-color: var(--border-glow);
        }
        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 40px;
            transition: var(--transition-fast);
            letter-spacing: 0.5px;
            position: relative;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        .nav-link:hover {
            color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.06);
        }
        .nav-link.active {
            color: #fff;
            background: rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        .nav-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        /* ─── Hero Section ────────────────────────── */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 0 80px;
            position: relative;
        }
        .hero-content {
            text-align: center;
            max-width: 850px;
            position: relative;
            z-index: 2;
        }
        .hero-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 50px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
            animation: badgePulse 3s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 0px rgba(0, 229, 255, 0);
            }
            50% {
                box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
            }
        }
        .hero-title {
            font-family: var(--font-mono);
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 0%, #c0e0ff 30%, #00e5ff 60%, #b44dff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleShimmer 6s ease-in-out infinite;
            background-size: 300% 300%;
        }
        @keyframes titleShimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }
        .hero-subtitle {
            font-family: var(--font-mono);
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .hero-tagline {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 36px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 14px 32px;
            border-radius: 50px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-bounce);
            border: none;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00b8d4, #0097a7);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 184, 212, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 184, 212, 0.55);
            background: linear-gradient(135deg, #00d4f0, #00acc1);
        }
        .btn-outline {
            background: transparent;
            color: var(--accent-cyan);
            border: 2px solid rgba(0, 229, 255, 0.4);
        }
        .btn-outline:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
            background: rgba(0, 229, 255, 0.05);
            transform: translateY(-3px);
        }
        .btn-purple {
            background: linear-gradient(135deg, #8c2eff, #6a1bcc);
            color: #fff;
            box-shadow: 0 8px 30px rgba(140, 46, 255, 0.4);
        }
        .btn-purple:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(140, 46, 255, 0.55);
            background: linear-gradient(135deg, #9d4fff, #7b2ff0);
        }

        .btn .btn-icon {
            font-size: 1.1rem;
        }

        /* ─── Floating Orbs ───────────────────────── */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite;
            opacity: 0.4;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(0, 229, 255, 0.3);
            top: 10%;
            left: -5%;
            animation-delay: 0s;
            animation-duration: 14s;
        }
        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(180, 77, 255, 0.3);
            bottom: 15%;
            right: -8%;
            animation-delay: -5s;
            animation-duration: 16s;
        }
        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(76, 255, 76, 0.2);
            top: 50%;
            left: 40%;
            animation-delay: -9s;
            animation-duration: 18s;
        }
        .orb-4 {
            width: 180px;
            height: 180px;
            background: rgba(255, 77, 166, 0.2);
            top: 30%;
            right: 20%;
            animation-delay: -3s;
            animation-duration: 15s;
        }
        @keyframes orbFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            20% {
                transform: translate(40px, -30px) scale(1.1);
            }
            40% {
                transform: translate(-20px, 50px) scale(0.9);
            }
            60% {
                transform: translate(-50px, -20px) scale(1.05);
            }
            80% {
                transform: translate(30px, 40px) scale(0.95);
            }
        }

        /* ─── Section Styles ──────────────────────── */
        .section {
            padding: 80px 0;
            position: relative;
            z-index: 2;
        }
        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }
        .section-label {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 229, 255, 0.06);
            border-radius: 30px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }
        .section-title {
            font-family: var(--font-mono);
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            color: #fff;
        }
        .section-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
            margin: 16px auto;
        }

        /* ─── Glass Card ──────────────────────────── */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 32px;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: var(--transition-smooth);
        }
        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), var(--shadow-glow);
            border-color: var(--border-glow);
        }
        .glass-card:hover::before {
            opacity: 1;
        }
        .glass-card.purple-glow:hover {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), var(--shadow-purple-glow);
            border-color: var(--border-purple-glow);
        }

        /* ─── About Section ───────────────────────── */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 40px;
            align-items: start;
        }
        .about-avatar-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .avatar-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            padding: 4px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.3), 0 0 80px rgba(180, 77, 255, 0.2);
            animation: avatarGlow 4s ease-in-out infinite;
            position: relative;
        }
        @keyframes avatarGlow {
            0%,
            100% {
                box-shadow: 0 0 50px rgba(0, 229, 255, 0.3), 0 0 80px rgba(180, 77, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 70px rgba(0, 229, 255, 0.5), 0 0 100px rgba(180, 77, 255, 0.35);
            }
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            overflow: hidden;
        }
        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .avatar-emoji {
            font-size: 5rem;
            filter: grayscale(0%);
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(76, 255, 76, 0.08);
            border: 1px solid rgba(76, 255, 76, 0.3);
            border-radius: 50px;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--accent-green);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%,
            100% {
                box-shadow: 0 0 0px var(--accent-green);
            }
            50% {
                box-shadow: 0 0 15px var(--accent-green), 0 0 25px var(--accent-green);
            }
        }
        .about-text-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .about-text-area h3 {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 4px;
        }
        .about-text-area p {
            color: var(--text-secondary);
            line-height: 1.8;
            font-size: 0.98rem;
        }
        .highlight {
            color: var(--accent-cyan);
            font-weight: 600;
        }
        .highlight-purple {
            color: var(--accent-purple);
            font-weight: 600;
        }
        .highlight-green {
            color: var(--accent-green);
            font-weight: 600;
        }
        .highlight-orange {
            color: var(--accent-orange);
            font-weight: 600;
        }
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }
        .tag {
            padding: 7px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            transition: var(--transition-fast);
            cursor: default;
        }
        .tag:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.05);
        }
        .tag.java-tag:hover {
            border-color: #f89820;
            color: #f89820;
            background: rgba(248, 152, 32, 0.06);
        }
        .tag.python-tag:hover {
            border-color: #ffd740;
            color: #ffd740;
            background: rgba(255, 215, 64, 0.06);
        }
        .tag.os-tag:hover {
            border-color: #ff4da6;
            color: #ff4da6;
            background: rgba(255, 77, 166, 0.06);
        }

        /* ─── Projects Section ───────────────────── */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            cursor: default;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .project-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: var(--transition-smooth);
        }
        .project-card:hover::after {
            opacity: 1;
        }
        .project-card.purple-line::after {
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
        }
        .project-card.green-line::after {
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
        }
        .project-card.orange-line::after {
            background: linear-gradient(90deg, transparent, var(--accent-orange), transparent);
        }
        .project-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .icon-cyan {
            background: rgba(0, 229, 255, 0.12);
            color: var(--accent-cyan);
        }
        .icon-purple {
            background: rgba(180, 77, 255, 0.12);
            color: var(--accent-purple);
        }
        .icon-green {
            background: rgba(76, 255, 76, 0.12);
            color: var(--accent-green);
        }
        .icon-orange {
            background: rgba(255, 140, 66, 0.12);
            color: var(--accent-orange);
        }
        .icon-pink {
            background: rgba(255, 77, 166, 0.12);
            color: var(--accent-pink);
        }
        .project-card h4 {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .project-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.65;
            flex-grow: 1;
        }
        .project-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .project-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .status-active {
            background: rgba(76, 255, 76, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(76, 255, 76, 0.3);
        }
        .status-inactive {
            background: rgba(255, 140, 66, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 140, 66, 0.3);
        }
        .status-translating {
            background: rgba(255, 215, 64, 0.1);
            color: var(--accent-yellow);
            border: 1px solid rgba(255, 215, 64, 0.3);
        }
        .project-tech {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.03);

            15% {

            }
            30% {

            }
            45% {
                transform: scale(1.2);
            }
            60% {
                transform: scale(1);
            }

            10% {

            }
            80% {

            100% {

    <!-- ═══════════════ SCRIPTS ═══════════════ -->
    <script>
        // ─── Canvas Background Animation ───────────────────
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const PARTICLE_COUNT = 120;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.color = Math.random() < 0.5 ?
                    `rgba(0,229,255,${this.opacity})` :
                    `rgba(180,77,255,${this.opacity})`;
                if (Math.random() < 0.15) {
                    this.color = `rgba(76,255,76,${this.opacity})`;
                }
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < -20 || this.x > width + 20 || this.y < -20 || this.y > height + 20) {
                    this.reset();
                    if (Math.random() < 0.5) this.x = Math.random() * width;
                    else this.y = Math.random() * height;
                }
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // Glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace(/[\d.]+\)$/, '0.08)');
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        // Connection lines between nearby particles
        function drawConnections() {
            const maxDist = 140;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.12;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0,229,255,${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            // Subtle grid
            ctx.strokeStyle = 'rgba(255,255,255,0.015)';
            ctx.lineWidth = 0.5;
            const gridSize = 60;
            for (let x = gridSize; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = gridSize; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            particles.forEach(p => { p.update();
                p.draw(ctx); });
            drawConnections();
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // ─── Custom Cursor ──────────────────────────────────
        const cursorTrail = document.getElementById('cursorTrail');
        const cursorDot = document.getElementById('cursorDot');
        let mouseX = 0,
            mouseY = 0;
        let trailX = 0,
            trailY = 0;
        let isHovering = false;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorTrail.classList.add('active');
            cursorDot.classList.add('active');
            // Check if hovering over interactive elements
            const target = e.target;
            const interactive = target.closest('a, button, .contact-card, .project-card, .skill-card, .copy-btn, .nav-link');
            if (interactive) {
                cursorDot.classList.add('hovering');
                isHovering = true;
            } else {
                cursorDot.classList.remove('hovering');
                isHovering = false;
            }
        });
        document.addEventListener('mouseleave', () => {
            cursorTrail.classList.remove('active');
            cursorDot.classList.remove('active');
        });
        document.addEventListener('mouseenter', () => {
            cursorTrail.classList.add('active');
            cursorDot.classList.add('active');
        });

        function animateCursor() {
            trailX += (mouseX - trailX) * 0.25;
            trailY += (mouseY - trailY) * 0.25;
            cursorTrail.style.left = trailX + 'px';
            cursorTrail.style.top = trailY + 'px';
            cursorTrail.style.transform = `translate(-50%, -50%) scale(${isHovering ? 1.8 : 1})`;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // ─── Copy Server IP ────────────────────────────────
        function copyServerIP() {
            const ip = document.getElementById('serverIP').textContent;
            const btn = document.getElementById('copyBtn');
            const btnText = document.getElementById('copyBtnText');
            const feedback = document.getElementById('copyFeedback');

            navigator.clipboard.writeText(ip).then(() => {
                btn.classList.add('copied');
                btnText.textContent = 'Скопировано! ✓';
                feedback.style.display = 'inline';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btnText.textContent = 'Скопировать IP';
                    feedback.style.display = 'none';
                }, 2500);
            }).catch(() => {
                // Fallback
                const tempInput = document.createElement('input');
                tempInput.value = ip;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                btn.classList.add('copied');
                btnText.textContent = 'Скопировано! ✓';
                feedback.style.display = 'inline';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btnText.textContent = 'Скопировать IP';
                    feedback.style.display = 'none';
                }, 2500);
            });
        }

        // ─── Navbar Active State on Scroll ─────────────────
        const sections = document.querySelectorAll('section[id], .hero-section[id]');
        const navLinks = document.querySelectorAll('.nav-link');

        function updateActiveNav() {
            let currentSection = 'hero';
            const scrollPos = window.scrollY + 100;

            sections.forEach(section => {
                const sectionTop = section.offsetTop - 120;
                const sectionBottom = sectionTop + section.offsetHeight;
                if (scrollPos >= sectionTop && scrollPos < sectionBottom) {
                    currentSection = section.getAttribute('id');
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('data-section') === currentSection) {
                    link.classList.add('active');
                }
            });
        }
        window.addEventListener('scroll', updateActiveNav);
        updateActiveNav();

        // ─── Animate Skill Bars on Scroll ──────────────────
        const skillBars = document.querySelectorAll('.skill-bar-fill');
        let skillsAnimated = false;

        function animateSkills() {
            if (skillsAnimated) return;
            const skillsSection = document.getElementById('skills');
            if (!skillsSection) return;
            const rect = skillsSection.getBoundingClientRect();
            if (rect.top < window.innerHeight - 150 && rect.bottom > 0) {
                skillsAnimated = true;
                skillBars.forEach(bar => {
                    const targetWidth = bar.getAttribute('data-width');
                    if (targetWidth) {
                        setTimeout(() => {
                            bar.style.width = targetWidth + '%';
                        }, 100);
                    }
                });
            }
        }
        window.addEventListener('scroll', animateSkills);
        animateSkills();

        // ─── Smooth scroll for nav links ───────────────────
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('data-section');
                const targetEl = document.getElementById(targetId);
                if (targetEl) {
                    const offset = 100;
                    const top = targetEl.getBoundingClientRect().top + window.pageYOffset - offset;
                    window.scrollTo({ top, behavior: 'smooth' });
                }
            });
        });

        // ─── Parallax on orbs ──────────────────────────────
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.orb');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            orbs.forEach((orb, i) => {
                const factor = (i + 1) * 0.6;
                orb.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });
        });

        // ─── Set current year ──────────────────────────────
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // ─── Reveal animations on scroll ───────────────────
        const observerOptions = {
            threshold: 0.15,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.glass-card, .project-card, .skill-card, .contact-card, .server-card').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
            observer.observe(el);
        });

        // Trigger initial reveal for elements in view
        setTimeout(() => {
            document.querySelectorAll('.glass-card, .project-card, .skill-card, .contact-card, .server-card').forEach(
            el => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight && rect.bottom > 0) {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }
            });
        }, 300);

        // ─── Keyboard shortcut for server IP ───────────────
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'c' && document.activeElement === document.body) {
                const ipEl = document.getElementById('serverIP');
                if (ipEl) {
                    const rect = ipEl.getBoundingClientRect();
                    if (rect.top < window.innerHeight && rect.bottom > 0) {
                        copyServerIP();
                    }
                }
            }
        });

        // ─── Console greeting ──────────────────────────────
        console.log(`
        %c🚀 funsmine %c| %cJava Developer & Minecraft Enthusiast
        %c💻 github.com/funsmine %c| %c🌍 mc.funsmine.su
        %c🐡 Running on OpenBSD — Debian without systemd
            `,
            'color:#00e5ff;font-size:18px;font-weight:bold;',
            '',
            'color:#e0e0f0;font-size:13px;',
            'color:#b44dff;',
            '',
            'color:#4cff4c;',
            'color:#ff4da6;font-style:italic;'
        );
        console.log('%c☕ Java 92% | 🐍 Python 55% | 🎮 Minecraft Dev 88%', 'color:#ffd740;');
        console.log('%cСпасибо, что заглянули! Открыт к сотрудничеству 🎯', 'color:#00e5ff;');
    </script>
</body>
</html>
