<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#020308">
  <title>404 - m1lwh</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; overflow-x: hidden; }
    .nf-wrap { position: relative; z-index: 1; text-align: center; max-width: 580px; }
    .nf-code {
      font-family: var(--font-mono);
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
      background: var(--grad-brand);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 5s ease-in-out infinite;
    }
    .nf-title {
      margin-top: 10px;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 700;
    }
    .nf-text { margin-top: 12px; color: var(--text-2); font-size: 0.98rem; }
    .nf-actions { margin-top: 30px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .nf-terminal {
      margin-top: 38px;
      text-align: left;
      white-space: pre-wrap;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-2);
      line-height: 1.8;
      padding: 18px 22px;
      border: 1px solid var(--stroke);
      border-radius: var(--r-md);
      background: rgba(255, 255, 255, 0.02);
      box-shadow: var(--shadow-2);
    }
    .nf-terminal .green { color: var(--green); }
    .nf-terminal .cyan { color: var(--cyan); }
    .nf-terminal .dim { color: var(--text-3); }
    .lang-switch { margin: 34px auto 0; width: max-content; }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="bg-aurora">
      <div class="aurora-1"></div>
      <div class="aurora-2"></div>
      <div class="aurora-3"></div>
    </div>
    <div class="bg-nebula"></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
  </div>

  <div class="nf-wrap">
    <div class="nf-code" aria-hidden="true">404</div>
    <h1 class="nf-title" data-i18n="404_title">РЎС‚СЂР°РЅРёС†Р° РЅРµ РЅР°Р№РґРµРЅР°</h1>
    <p class="nf-text" data-i18n="404_desc">РџРѕС…РѕР¶Рµ, СЌС‚РѕС‚ РїСѓС‚СЊ РІРµРґС‘С‚ РІ РїСѓСЃС‚РѕС‚Сѓ - РєР°Рє РјР°РєР°СЂРѕРЅС‹ РёР· 2022 РіРѕРґР°.</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="./">
        <svg class="icon" aria-hidden="true"><use href="#i-house"></use></svg>
        <span data-i18n="404_home">РќР° РіР»Р°РІРЅСѓСЋ</span>
      </a>
      <a class="btn btn-ghost" href="https://github.com/m1lwh" target="_blank" rel="noopener">
        <svg class="icon" aria-hidden="true"><use href="#i-github"></use></svg>
        GitHub
      </a>
    </div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="ru" aria-pressed="true">RU</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <pre class="nf-terminal"><span class="cyan">$</span> whoami
<span class="dim">m1lwh: not found - but still on <span class="green">GitHub</span></span>

<span class="cyan">$</span> cd ~/m1lwh &amp;&amp; open index.html</pre>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <symbol id="i-house" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></symbol>
  </svg>

  <script>
    (function () {
      'use strict';
      var LANG_KEY = 'm1lwh_lang';
      var saved = localStorage.getItem(LANG_KEY);
      var lang = (saved === 'ru' || saved === 'en') ? saved : 'ru';
      var DICT = {
        '404_title': { ru: 'РЎС‚СЂР°РЅРёС†Р° РЅРµ РЅР°Р№РґРµРЅР°', en: 'Page not found' },
        '404_desc': {
          ru: 'РџРѕС…РѕР¶Рµ, СЌС‚РѕС‚ РїСѓС‚СЊ РІРµРґС‘С‚ РІ РїСѓСЃС‚РѕС‚Сѓ - РєР°Рє РјР°РєР°СЂРѕРЅС‹ РёР· 2022 РіРѕРґР°.',
          en: 'Looks like this path leads into the void - like pasta from 2022.',
        },
        '404_home': { ru: 'РќР° РіР»Р°РІРЅСѓСЋ', en: 'Go home' },
      };
      var sw = document.querySelector('.lang-switch');
      function apply(l) {
        lang = l;
        document.documentElement.lang = l;
        if (sw) sw.dataset.lang = l;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var k = el.getAttribute('data-i18n');
          if (DICT[k]) el.textContent = DICT[k][l];
        });
        document.querySelectorAll('.lang-switch button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.lang === l));
        });
      }
      apply(lang);
      document.querySelectorAll('.lang-switch button').forEach(function (b) {
        b.addEventListener('click', function () {
          localStorage.setItem(LANG_KEY, b.dataset.lang);
          apply(b.dataset.lang);
        });
      });
    })();
  </script>
</body>
</html>
